<!-- Shared <head> content. Each page sets title and description in its
     front matter (the block between --- lines at the top of the file). -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}" />
  <link rel="canonical" href="https://pierrolaloune.github.io{{ page.url }}" />

  <!-- Each page exists in English (/) and French (/fr/). -->
  <link rel="alternate" hreflang="en" href="https://pierrolaloune.github.io{{ page.url | remove_first: "/fr" }}" />
  <link rel="alternate" hreflang="fr" href="https://pierrolaloune.github.io/fr{{ page.url | remove_first: "/fr" }}" />
  <link rel="alternate" hreflang="x-default" href="https://pierrolaloune.github.io{{ page.url | remove_first: "/fr" }}" />

  <!-- Preview card when the page is shared (LinkedIn, Bluesky, Slack...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Pierre Bouchet" />
  <meta property="og:title" content="{{ page.social_title | default: page.title }}" />
  <meta property="og:description" content="{{ page.description }}" />
  <meta property="og:url" content="https://pierrolaloune.github.io{{ page.url }}" />
  <meta property="og:image" content="https://pierrolaloune.github.io/images/og_profile.jpg" />
  <meta property="og:image:alt" content="Portrait of Pierre Bouchet" />
  <meta property="og:locale" content="{% if page.lang == "fr" %}fr_FR{% else %}en_GB{% endif %}" />
  <meta name="twitter:card" content="summary" />

  <!-- Content animated on scroll is only hidden when JavaScript runs. -->
  <script>document.documentElement.classList.add("js");</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
